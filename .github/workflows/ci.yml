name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint e testes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Node 22 para espelhar os containers (node:22-alpine em dev,
      # node:22-bookworm-slim no build de producao).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes unitarios
        run: npm test

      # `npm run build` nao roda aqui: o AGENTS.md do projeto proibe
      # explicitamente. Os testes end-to-end tambem ficam de fora por exigirem
      # Postgres e RabbitMQ no ar (ver tests/e2e/README.md).

  security:
    name: Auditoria de dependencias
    runs-on: ubuntu-latest
    # Bloqueante desde o upgrade para next@16, que zerou as 5 vulnerabilidades
    # altas que so tinham correcao com breaking change. Com o backlog em zero,
    # qualquer achado novo de nivel alto e regressao e deve derrubar o CI.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Auditar (sem instalar)
        run: npm audit --package-lock-only --audit-level=high
